name: Build unsigned IPA for ESign
on: push

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .app (no signing)
        run: |
          xcodebuild -workspace Moonlight.xcworkspace \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $RUNNER_TEMP/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Make IPA
        run: |
          APP_PATH=$(find $RUNNER_TEMP/derived/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r Moonlight-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-ipa
          path: ${{ runner.temp }}/Moonlight-unsigned.ipa
